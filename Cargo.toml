[package]
name = "soundwav"
version = "0.1.0"
edition = "2021"
description = "Audio waves wrapped around the focused window, a Zoolander plugin"
license = "MIT"
repository = "https://github.com/Monkellie/soundwav"
readme = "README.md"

[dependencies]
smithay-client-toolkit = "0.20"
wayland-client = "0.31"
wayland-backend = { version = "0.3", features = ["client_system"] }
wgpu = "30.0.1"
raw-window-handle = "0.6"
pollster = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
bytemuck = { version = "1", features = ["derive"] }
libc = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
